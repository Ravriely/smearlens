<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmearLens, review workspace</title>
<style>
:root {
  --paper: #f5f1ea;
  --card: #fdfbf7;
  --ink: #1d1a2b;
  --ink-2: #565066;
  --line: #ded7ca;
  --accent: #5b2f91;
  --accent-soft: #ebe3f5;
  --review: #c2410c;
  --review-soft: #fdeadc;
  --example-bg: #f3efe6;
  --shadow: 0 1px 0 rgba(29,26,43,.04), 0 6px 18px -12px rgba(29,26,43,.25);
  --t-neutrophil: #1f7a99;
  --t-lymphocyte: #7a3fb5;
  --t-monocyte: #b7791f;
  --t-eosinophil: #c4453a;
  --t-basophil: #36479a;
  --t-ig: #2b8a5f;
  --t-erythroblast: #b23a7a;
  --t-platelet: #6b7280;
  --ok: #2b7a4b;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15121d;
    --card: #1d1929;
    --ink: #ece8f4;
    --ink-2: #a39cb5;
    --line: #342e45;
    --accent: #b894ef;
    --accent-soft: #2c2342;
    --review: #fb9a5c;
    --review-soft: #3a2619;
    --example-bg: #221e2f;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -14px rgba(0,0,0,.7);
    --t-neutrophil: #4fb8d8;
    --t-lymphocyte: #b48af0;
    --t-monocyte: #e8b04a;
    --t-eosinophil: #ef7d72;
    --t-basophil: #7b8cf0;
    --t-ig: #52c795;
    --t-erythroblast: #e873b2;
    --t-platelet: #a3a9b5;
    --ok: #5fcf8f;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 28px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font: 600 22px/1 var(--serif); letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; color: var(--accent); }
.brand small { font: 500 11px/1 var(--mono); color: var(--ink-2); letter-spacing: .08em; text-transform: uppercase; padding-left: 12px; border-left: 1px solid var(--line); }
.spacer { flex: 1; }
.pill {
  font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: transparent;
}
.pill.mock { color: var(--review); border-color: currentColor; }
.pill.live { color: var(--ok); border-color: currentColor; }
.pill.key { display: inline-flex; align-items: center; gap: 6px; }
.pill.key i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.pill.key.set i { background: var(--ok); }
button.pill { cursor: pointer; }
button.pill:hover { color: var(--ink); }

main {
  flex: 1;
  display: grid;
  gap: 16px;
  padding: 16px 28px;
  grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas: "viewer formula review" "viewer agent agent";
  align-items: stretch;
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); padding: 14px 16px; min-width: 0;
}
.card h2 {
  margin: 0 0 10px; font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.viewer { grid-area: viewer; display: flex; flex-direction: column; gap: 12px; }
.formula { grid-area: formula; display: flex; flex-direction: column; }
.review { grid-area: review; display: flex; flex-direction: column; }
.review .hint { margin-top: auto; padding-top: 10px; }
@media (min-width: 701px) {
  .review { contain: size; min-height: 100%; }
  .review .rlist { flex: 1 1 0; min-height: 0; overflow-y: auto; align-content: start; padding-right: 2px; }
  .rlist.dense { gap: 8px; }
  .rlist.dense .item { grid-template-columns: 54px 1fr; gap: 10px; padding: 6px 8px; }
  .rlist.dense .item canvas { width: 54px; height: 54px; }
  .rlist.dense .meter { margin-top: 5px; }
}
.agent { grid-area: agent; }

.drop {
  position: relative; cursor: pointer;
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); border-radius: 8px;
  background: var(--accent-soft); color: var(--ink);
}
.drop svg { width: 26px; height: 26px; flex: none; color: var(--accent); }
.drop b { font-weight: 600; }
.drop span { color: var(--ink-2); font-size: 13px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.drop:hover, .drop:focus-within, .drop.over { border-color: var(--accent); }
.drop.over { background: color-mix(in srgb, var(--accent) 22%, var(--card)); }
.drop.busy { opacity: .6; pointer-events: none; }
.drop .file { margin-left: auto; font: 12px/1.3 var(--mono); color: var(--ink-2); text-align: right; white-space: nowrap; }

.stage { position: relative; flex: 1; min-height: 0; border-radius: 8px; overflow: hidden; background: #000; line-height: 0; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.veil {
  position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 10px;
  padding: 24px; text-align: center; line-height: 1.4; color: #fff;
  background: rgba(15,12,22,.72); backdrop-filter: blur(2px);
}
.veil b { font: 600 18px/1.25 var(--serif); }
.veil span { font-size: 13px; color: #d9d3e6; max-width: 34em; }
.veil .el { font: 12px var(--mono); color: #b9b1cc; }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: sp 0.9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.alert {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4;
  background: var(--review-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--review) 45%, var(--line));
}
.alert b { color: var(--review); }
.alert button { margin-left: auto; flex: none; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
dialog {
  border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(440px, calc(100vw - 32px));
  background: var(--card); color: var(--ink); box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
}
dialog::backdrop { background: rgba(15,12,22,.55); }
dialog h3 { margin: 0 0 6px; font: 600 18px/1.2 var(--serif); }
dialog p { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); }
dialog input {
  width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  font: 13px var(--mono);
}
dialog input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
dialog .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.btn { font: 600 13px var(--sans); padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.stage svg.boxes { position: absolute; inset: 0; width: 100%; height: 100%; }
.box { fill: transparent; stroke: var(--c); stroke-width: 2.5; vector-effect: non-scaling-stroke; cursor: pointer; }
.box.rev { stroke-dasharray: 7 5; stroke-width: 3; }
.box-halo { fill: none; stroke: rgba(0,0,0,.55); stroke-width: 5.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.box-halo.rev { stroke-dasharray: 7 5; stroke-width: 6.5; }
.box.on { fill: color-mix(in srgb, var(--c) 22%, transparent); stroke-width: 4; }
.badge { pointer-events: none; }
.badge circle { fill: var(--review); stroke: #fff; stroke-width: 2; vector-effect: non-scaling-stroke; }
.badge text { fill: #fff; font: 700 14px var(--sans); text-anchor: middle; dominant-baseline: central; }
.tip {
  position: absolute; z-index: 3; pointer-events: none; line-height: 1.35;
  background: var(--card); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent));
  padding: 6px 9px; border-radius: 6px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
  white-space: nowrap; transform: translate(12px, 12px);
}

.tip .rv { color: var(--review); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.legend .dash i { background: transparent; border: 2px dashed var(--review); width: 14px; height: 10px; }

.stack { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--line); margin-bottom: 12px; gap: 1px; }
.stack div { background: var(--c); }
.rows { display: grid; gap: 2px; flex: 1; align-content: space-around; padding-bottom: 8px; }
.row {
  display: grid; grid-template-columns: 12px 1fr auto 62px; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px;
}
.row:hover, .row.on { background: color-mix(in srgb, var(--c) 14%, transparent); }
.row .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

.row .pc { white-space: nowrap; font: 600 17px/1 var(--serif); font-variant-numeric: tabular-nums; text-align: right; }
.row .ct { font: 12px var(--mono); color: var(--ink-2); text-align: right; }
.row.zero { opacity: .45; }
.row.zero .sw { background: transparent; border: 1.5px solid var(--c); }
.counts { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.stat b { display: block; font: 600 26px/1.05 var(--serif); font-variant-numeric: tabular-nums; }
.stat span { font: 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }

.rlist { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; border-left: 4px solid var(--c); cursor: pointer; }
.item:hover, .item.on { background: var(--review-soft); }
.item canvas { width: 76px; height: 76px; border-radius: 6px; background: #000; display: block; }
.item .no { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--review); color: #fff; font: 700 12px var(--sans); margin-right: 6px; }
.item .ty { font-weight: 600; }
.item .sub { font: 12px var(--mono); color: var(--ink-2); margin-top: 3px; }
.meter { height: 5px; border-radius: 3px; background: var(--line); margin-top: 7px; position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--c); }
.meter u { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--ink); opacity: .7; }
.hint { margin: 10px 0 0; font-size: 12px; color: var(--ink-2); }
.empty { color: var(--ink-2); font-size: 13px; }

.agent { background: var(--example-bg); border-style: dashed; }
.agent .tag { color: var(--review); border: 1px solid currentColor; padding: 3px 7px; border-radius: 999px; font-size: 10px; }
.agent { display: flex; flex-direction: column; }
.agent .body { flex: 1; align-content: space-between; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; }
.agent p { margin: 0 0 8px; font-size: 13.5px; }
.agent h3 { margin: 0 0 4px; font: 600 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.agent ul { margin: 0 0 8px; padding-left: 18px; font-size: 13.5px; }
.agent .meta { grid-column: 1 / -1; margin: 4px 0 0; font: 11px/1.4 var(--mono); color: var(--ink-2); }
.agent .wait { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; }
.agent .wait .spin { flex: none; width: 22px; height: 22px; border-color: color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); }
.agent .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.agent .chip { --c: var(--accent); font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--c); cursor: default; }
.agent .chip b { color: var(--c); font-weight: 600; }
.agent .chip.on { background: color-mix(in srgb, var(--c) 18%, transparent); }
.agent .body { contain: size; align-content: start; min-height: 180px; overflow-y: auto; scrollbar-gutter: stable; padding-right: 6px; }

footer {
  position: sticky; bottom: 0; border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 92%, var(--accent));
  color: var(--ink-2); font-size: 12.5px; padding: 8px 28px; display: flex; align-items: center; gap: 10px;
}
footer svg { width: 15px; height: 15px; flex: none; color: var(--accent); }

@media (max-width: 1100px) {
  main { grid-template-columns: 1fr 1fr; grid-template-rows: auto; grid-template-areas: "viewer viewer" "formula review" "agent agent"; }
  .stage { flex: none; aspect-ratio: var(--ar, 1024 / 960); }
  .agent .body { contain: none; min-height: 0; overflow: visible; padding-right: 0; }
}
@media (max-width: 700px) {
  header { padding: 10px 16px; flex-wrap: wrap; }
  .brand small { display: none; }
  main { padding: 12px 16px; grid-template-rows: auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "viewer" "formula" "review" "agent"; }
  .drop { flex-wrap: wrap; }
  .drop .file { margin-left: 0; white-space: normal; text-align: left; flex-basis: 100%; }
  .agent .body { grid-template-columns: 1fr; }
  .row { grid-template-columns: 12px 1fr auto 58px; }
  footer { position: static; padding: 8px 16px; font-size: 12px; align-items: flex-start; }
  footer svg { margin-top: 2px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="14" cy="14" r="9"/><path d="M21 21l7 7" stroke-linecap="round"/><circle cx="14" cy="14" r="3.5" fill="currentColor" stroke="none"/></svg>
    SmearLens <small data-i="tagline"></small>
  </div>
  <div class="spacer"></div>
  <span class="pill mock" id="mode"></span>
  <button class="pill key" id="keybtn" type="button"><i></i><span id="keylbl"></span></button>
  <button class="pill" id="lang" type="button" aria-label="Language">FR</button>
</header>

<main>
  <section class="card viewer" aria-label="Analysed image">
    <label class="drop" id="drop">
      <input type="file" id="pick" accept="image/jpeg,image/png,image/webp">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 20V6m0 0l-5 5m5-5l5 5"/><path d="M5 20v2a2 2 0 002 2h14a2 2 0 002-2v-2"/></svg>
      <div><b data-i="drop1"></b> <span data-i="drop2"></span></div>
      <div class="file" id="file"></div>
    </label>
    <div class="alert" id="alert" hidden></div>
    <div class="stage" id="stage">
      <img id="img" alt="Blood smear field with detected white blood cells">
      <svg class="boxes" id="boxes"></svg>
      <div class="tip" id="tip" hidden></div>
      <div class="veil" id="veil" hidden><div class="spin"></div><b id="vtitle"></b><span id="vtext"></span><span class="el" id="vel"></span></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card formula" aria-label="Differential count">
    <h2><span data-i="formula"></span><span id="wbcn"></span></h2>
    <div class="stack" id="stack"></div>
    <div class="rows" id="rows"></div>
    <div class="counts" id="counts"></div>
  </section>

  <section class="card review" aria-label="Cells to review">
    <h2><span data-i="review"></span><span id="revn"></span></h2>
    <div class="rlist" id="rlist"></div>
    <p class="hint" id="revhint"></p>
  </section>

  <section class="card agent" aria-label="Agent report">
    <h2><span data-i="agent"></span><span class="tag" id="agenttag"></span></h2>
    <div class="body" id="agentbody"></div>
  </section>
</main>

<dialog id="keydlg">
  <form method="dialog" id="keyform">
    <h3 data-i="keyTitle"></h3>
    <p data-i="keyText"></p>
    <input id="keyin" type="password" autocomplete="off" spellcheck="false" aria-label="Access token">
    <div class="acts">
      <button class="btn" value="clear" type="submit" data-i="keyClear"></button>
      <button class="btn" value="cancel" type="submit" data-i="cancel"></button>
      <button class="btn primary" value="save" type="submit" data-i="save"></button>
    </div>
  </form>
</dialog>

<footer>
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 7v4M8 4.6v.1" stroke-linecap="round"/></svg>
  <span data-i="disclaimer"></span>
</footer>

<script>

const T = {

    keyTitle: "Jeton d'accès", keyText: "L'analyse réelle tourne sur un GPU et demande le jeton d'accès qu'on t'a donné. Il reste dans ce navigateur.",
    keyClear: "Oublier", cancel: "Annuler", save: "Enregistrer",
    drop1: "Dépose une image de frottis ici", drop2: "ou parcours. JPG, PNG ou WebP, un champ, 12 Mo max.",
    formula: "Formule leucocytaire", review: "À revoir", agent: "Compte rendu de l'agent",
    agentRecorded: "Exécution enregistrée sur cette image", agentLive: "Muse Spark, en direct",
    agentWorking: "L'agent relit la lame…",
    agentWait: "Il lit les comptes, demande un second avis sur les cellules douteuses, signale celles à ouvrir en premier et rédige le compte rendu. Compter 30 à 90 s.",
    agentFailed: "Le compte rendu de l'agent n'est pas disponible pour cette image. Les comptes ci-dessus restent valables.",
    agentNoCells: "Aucun globule blanc trouvé : rien à relire pour l'agent.",
    agentFlags: "À ouvrir d'abord", cell: "Cellule", high: "priorité haute", uncertain: "détection incertaine", agentLang: "Compte rendu rédigé en anglais par le modèle.",
    agentMeta: (r) => `${r.llm_calls} appels au modèle · ${r.second_opinions.length} seconds avis · ${r.flags.length} signalements · ${r.seconds.toFixed(0)} s`,
    cells: "globules blancs", wbc: "Globules blancs", rbc: "Globules rouges", plt: "Plaquettes",
    legendReview: "Pointillés : à revoir", conf: "confiance", proposed: "proposé",
    backToSample: "Revoir l'exemple hors ligne",
    revhint: (c) => `Types proposés. Cellules sous le seuil de confiance de ${c} %, calibré sur 2 560 cellules PBC. Survole une vignette pour la retrouver sur l'image.`,
    revnone: "Aucune cellule sous le seuil de confiance.",
    nCells: (n) => `${n} cellule${n > 1 ? "s" : ""}`,
    types: { neutrophil: "neutrophile", lymphocyte: "lymphocyte", monocyte: "monocyte", eosinophil: "éosinophile", basophil: "basophile", ig: "gran. immature", erythroblast: "érythroblaste", platelet: "plaquette" },
    file: (j) => `${j.name} · ${j.image.width}×${j.image.height} · ${(j.round_trip_s ?? j.timing_s.total).toFixed(1).replace(".", ",")} s`,
    sending: "Envoi de l'image…", analysing: "Analyse sur le GPU…", waking: "Réveil du GPU…",
    loadText: "La première image après une pause attend le démarrage du GPU, environ 45 s. Les suivantes prennent quelques secondes.",
    elapsed: (s) => `${s} s`,
    errTitle: "Analyse non faite.",
    errors: {
      unauthorized: "Le jeton d'accès manque ou n'est pas le bon.",
      too_large: "L'image dépasse 12 Mo.",
      too_many_pixels: "L'image dépasse 4096×4096 px.",
      not_an_image: "Le fichier n'est pas une image JPG, PNG ou WebP lisible.",
      bad_type: "Choisis une image JPG, PNG ou WebP.",
      analysis_failed: "L'analyse a échoué côté serveur. Réessaie, ou essaie une autre image.",
      network: "Impossible de joindre le backend. Vérifie la connexion, puis réessaie.",
      timeout: "Pas de réponse après 3 min. Réessaie dans un moment.",
      no_api: "Aucune adresse de backend : seule la démo hors ligne marche ici.",
      other: (s) => `Réponse inattendue du backend (HTTP ${s}).`
    },
    retry: "Réessayer", setKey: "Saisir le jeton",
    disclaimer: "Outil d'aide, pas un diagnostic. Il ne détecte pas les blastes : il les signale en revue. Chaque décompte est un brouillon à valider par un biologiste."
  }
};
const ORDER = ["neutrophil", "lymphocyte", "monocyte", "eosinophil", "basophil", "ig", "erythroblast", "platelet"];
const DEFAULT_CUTOFF = 0.9598;
const MAX_BYTES = 12 * 1024 * 1024;
const TIMEOUT_MS = 180000;
const REVIEW_TIMEOUT_MS = 240000;
const TOKEN_KEY = "smearlens.token";
const params = new URLSearchParams(location.search);
const API = (params.get("api") || (location.hostname.endsWith(".modal.run") ? location.origin : DEFAULT_API)).replace(/\/$/, "");
let lang = (params.get("lang") || "en") === "fr" ? "fr" : "en";
let data = null, sample = null, live = false, lastFile = null, lastError = null, imgUrl = null;
let cellIds = [];
let sampleReview = null, liveReview = null, reviewState = "idle", reviewSeq = 0;
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const col = (t) => `var(--t-${t})`;
const num = (x, d = 1) => x.toFixed(d).replace(".", lang === "fr" ? "," : ".");
const pct = (x) => num(x * 100) + " %";
const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);

const store = {
  get() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } },
  set(v) { try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch {} }
};

function mk(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function highlight(i, on) {
  document.querySelectorAll(`[data-idx="${i}"]`).forEach((e) => e.classList.toggle("on", on));
}

function chrome() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach((e) => { const v = t[e.dataset.i]; if (typeof v === "string") e.textContent = v; });
  $("lang").textContent = t.lang;
  const m = $("mode");
  m.textContent = live ? t.modeLive : t.modeDemo;
  m.className = "pill " + (live ? "live" : "mock");
  const has = !!store.get();
  $("keybtn").classList.toggle("set", has);
  $("keylbl").textContent = has ? t.keySet : t.key;
  showError(lastError);
}

function render() {
  chrome();
  if (!data) return;
  const t = T[lang], j = data;
  const cutoff = j.review_cutoff ?? DEFAULT_CUTOFF;
  $("file").textContent = t.file(j);
  $("wbcn").textContent = t.nCells(j.white_cell_count);

  const W = j.image.width, H = j.image.height, svg = $("boxes");
  $("stage").style.setProperty("--ar", `${W} / ${H}`);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.replaceChildren();
  const revs = [];
  j.white_cells.forEach((c, i) => { if (c.needs_review) revs.push(i); });
  cellIds = cellNumbers(j.white_cells);
  [...j.white_cells.keys()].sort((a, b) => j.white_cells[a].needs_review - j.white_cells[b].needs_review).forEach((i) => {
    const c = j.white_cells[i];
    const [x0, y0, x1, y1] = c.box, rev = c.needs_review;
    const g = mk("g", { style: `--c:${col(c.type)}` }, svg);
    const a = { x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 6 };
    mk("rect", { ...a, class: "box-halo" + (rev ? " rev" : "") }, g);
    const r = mk("rect", { ...a, class: "box" + (rev ? " rev" : ""), "data-idx": i }, g);
    r.addEventListener("mouseenter", () => highlight(i, true));
    r.addEventListener("mouseleave", () => { highlight(i, false); $("tip").hidden = true; });
    r.addEventListener("mousemove", (ev) => showTip(ev, c, cellIds[i]));
    if (rev) {
      const n = cellIds[i] ?? "", b = mk("g", { class: "badge", transform: `translate(${x0 + 4} ${y0 + 4})` }, g);
      mk("circle", { r: String(Math.max(11, W / 70)), cx: 0, cy: 0 }, b);
      const tx = mk("text", { x: 0, y: 1, "font-size": String(Math.max(13, W / 80)) }, b);
      tx.textContent = n;
    }
  });

  const counts = {};
  j.white_cells.forEach((c) => counts[c.type] = (counts[c.type] || 0) + 1);
  const shown = ORDER.filter((k) => k !== "platelet" || counts[k]);
  $("stack").replaceChildren(...ORDER.filter((k) => counts[k]).map((k) => {
    const d = document.createElement("div"); d.style.cssText = `--c:${col(k)};flex:${counts[k]}`; d.title = t.types[k]; return d;
  }));
  $("rows").replaceChildren(...shown.map((k) => {
    const d = document.createElement("div");
    d.className = "row" + (counts[k] ? "" : " zero"); d.style.setProperty("--c", col(k));
    const p = j.differential_percent[k] || 0;
    d.innerHTML = `<span class="sw"></span><span class="n">${cap(t.types[k])}</span><span class="ct">${counts[k] || 0} / ${j.white_cell_count}</span><span class="pc">${pct(p / 100)}</span>`;
    d.addEventListener("mouseenter", () => j.white_cells.forEach((c, i) => c.type === k && highlight(i, true)));
    d.addEventListener("mouseleave", () => j.white_cells.forEach((c, i) => highlight(i, false)));
    return d;
  }));
  $("counts").innerHTML = [[t.wbc, j.white_cell_count], [t.rbc, j.red_cell_count], [t.plt, j.platelet_count]]
    .map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  $("legend").replaceChildren(...ORDER.filter((k) => counts[k]).map((k) => {
    const s = document.createElement("span"); s.style.setProperty("--c", col(k)); s.innerHTML = `<i></i>${t.types[k]}`; return s;
  }));
  const dl = document.createElement("span"); dl.className = "dash"; dl.innerHTML = `<i></i>${t.legendReview}`; $("legend").appendChild(dl);
  if (live && sample) {
    const back = Object.assign(document.createElement("button"), { type: "button", className: "linkish", textContent: t.backToSample });
    back.style.marginLeft = "auto";
    back.addEventListener("click", showSample);
    $("legend").appendChild(back);
  }

  $("revn").textContent = revs.length ? `${revs.length} / ${j.white_cell_count}` : "0";
  $("rlist").classList.toggle("dense", revs.length > 2);
  $("rlist").replaceChildren(...(revs.length ? revs.map((idx, n) => {
    const c = j.white_cells[idx], d = document.createElement("div");
    d.className = "item"; d.dataset.idx = idx; d.style.setProperty("--c", col(c.type));
    const cv = document.createElement("canvas"); cv.width = cv.height = 152;
    d.appendChild(cv);
    const info = document.createElement("div");
    info.innerHTML = `<div><span class="no">${cellIds[idx] ?? ""}</span><span class="ty">${cap(t.types[c.type])}</span></div>
      <div class="sub">${num(c.confidence * 100)} % ${t.conf}${c.uncertain_detection ? ` · ${t.uncertain}` : ""}</div>
      <div class="meter"><i style="width:${c.confidence * 100}%"></i><u style="left:${cutoff * 100}%"></u></div>`;
    d.appendChild(info);
    d.addEventListener("mouseenter", () => highlight(idx, true));
    d.addEventListener("mouseleave", () => highlight(idx, false));
    drawCrop(cv, c.box);
    return d;
  }) : [Object.assign(document.createElement("p"), { className: "empty", textContent: t.revnone })]));
  $("revhint").textContent = t.revhint(num(cutoff * 100, 0));

  renderAgent();
}

// Same numbering as the review agent (smearlens.agent.cells_from_reports): white cells from 1, platelets skipped.
function cellNumbers(cells) {
  let n = 0;
  return cells.map((c) => c.type === "platelet" ? null : ++n);
}

const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const inline = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

function mdSections(md) {
  const out = [];
  let cur = null, list = null;
  const open = (h) => { cur = [h, []]; out.push(cur); list = null; };
  for (const raw of md.split("\n")) {
    const line = raw.trim();
    if (!line) { list = null; continue; }
    const head = line.match(/^#{1,6}\s+(.+)$/) || line.match(/^\*\*([^*]+?):?\*\*:?$/);
    if (head) { open(head[1].replace(/[:*]+$/, "")); continue; }
    const lead = line.match(/^\*\*([^*]+?):\*\*\s*(.+)$/);
    if (lead) { open(lead[1]); cur[1].push(`<p>${inline(lead[2])}</p>`); continue; }
    if (!cur) open("");
    const li = line.match(/^[-*•]\s+(.+)$/);
    if (li) {
      if (!list) { list = []; cur[1].push(list); }
      list.push(`<li>${inline(li[1])}</li>`);
    } else { list = null; cur[1].push(`<p>${inline(line)}</p>`); }
  }
  return out.filter(([h, b]) => b.length)
    .map(([h, b]) => [esc(h), b.map((x) => Array.isArray(x) ? `<ul>${x.join("")}</ul>` : x).join("")]);
}

function renderAgent() {
  const t = T[lang], body = $("agentbody"), r = live ? liveReview : sampleReview;
  $("agenttag").textContent = live ? t.agentLive : t.agentRecorded;
  if (live && reviewState === "busy") {
    body.innerHTML = `<div class="wait"><div class="spin"></div><p><b>${t.agentWorking}</b> ${t.agentWait}</p></div>`;
    return;
  }
  if (!r || !r.report) {
    body.innerHTML = `<p class="empty">${live && reviewState === "none" ? t.agentNoCells : t.agentFailed}</p>`;
    return;
  }
  const secs = mdSections(r.report).map(([h, b]) => `<div>${h ? `<h3>${h}</h3>` : ""}${b}</div>`);
  const key = (b) => b.map((v) => Math.round(v)).join(",");
  const where = new Map(data.white_cells.map((c, i) => [key(c.box), i]));
  const chips = r.flags.map((f) => {
    const i = where.get(key(f.box)), k = ORDER.includes(f.type) ? f.type : "neutrophil";
    return `<span class="chip" data-idx="${i ?? ""}" style="--c:${col(k)}" title="${esc(f.reason)}"><b>${t.cell} ${f.cell_id}</b> ${t.types[f.type] || f.type}${f.priority === "high" ? " · " + t.high : ""}</span>`;
  });
  if (chips.length) secs.push(`<div><h3>${t.agentFlags}</h3><div class="chips">${chips.join("")}</div></div>`);
  secs.push(`<p class="meta">${[t.agentLang, t.agentMeta(r)].filter(Boolean).join(" · ")}</p>`);
  body.innerHTML = secs.join("");
  body.querySelectorAll(".chip[data-idx]").forEach((c) => {
    if (c.dataset.idx === "") return;
    c.addEventListener("mouseenter", () => highlight(c.dataset.idx, true));
    c.addEventListener("mouseleave", () => highlight(c.dataset.idx, false));
  });
}

async function requestReview(file, analysis) {
  const seq = ++reviewSeq;
  liveReview = null;
  if (!analysis.white_cells.length) { reviewState = "none"; return renderAgent(); }
  reviewState = "busy";
  renderAgent();
  try {
    const image = await new Promise((ok, ko) => {
      const fr = new FileReader();
      fr.onload = () => ok(String(fr.result).split(",")[1]);
      fr.onerror = ko;
      fr.readAsDataURL(file);
    });
    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), REVIEW_TIMEOUT_MS);
    const res = await fetch(`${API}/api/review`, {
      method: "POST", signal: ctrl.signal,
      headers: { "content-type": "application/json", "x-smearlens-token": store.get() },
      body: JSON.stringify({ analysis, image, name: file.name })
    }).finally(() => clearTimeout(timer));
    const body = await res.json().catch(() => null);
    if (seq !== reviewSeq) return;
    liveReview = res.ok && body?.report ? body : null;
    reviewState = liveReview ? "done" : "error";
  } catch {
    if (seq !== reviewSeq) return;
    reviewState = "error";
  }
  if (live) renderAgent();
}

function drawCrop(cv, box) {
  const img = $("img");
  const go = () => {
    const [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0, s = Math.max(w, h) * 1.3;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const sx = Math.max(0, Math.min(img.naturalWidth - s, cx - s / 2)), sy = Math.max(0, Math.min(img.naturalHeight - s, cy - s / 2));
    const ctx = cv.getContext("2d");
    ctx.drawImage(img, sx, sy, s, s, 0, 0, cv.width, cv.height);
  };
  img.complete && img.naturalWidth ? go() : img.addEventListener("load", go, { once: true });
}

function showTip(ev, c, id) {
  const tip = $("tip"), r = $("stage").getBoundingClientRect(), t = T[lang];
  tip.style.setProperty("--c", col(c.type));
  tip.innerHTML = (id ? `${t.cell} ${id} · ` : "") + `<b>${cap(t.types[c.type])}</b> · ${num(c.confidence * 100)} %` + (c.needs_review ? `<br><span class="rv">${t.review}${c.uncertain_detection ? ` · ${t.uncertain}` : ""}</span>` : "");
  tip.hidden = false;
  let x = ev.clientX - r.left, y = ev.clientY - r.top;
  tip.style.left = Math.min(x, r.width - tip.offsetWidth - 20) + "px";
  tip.style.top = Math.min(y, r.height - tip.offsetHeight - 20) + "px";
}

function showError(code, status) {
  lastError = code ? { code: code.code || code, status: code.status ?? status } : null;
  const box = $("alert");
  if (!lastError) { box.hidden = true; box.replaceChildren(); return; }
  const t = T[lang], e = t.errors[lastError.code];
  const msg = typeof e === "function" ? e(lastError.status) : e || t.errors.other(lastError.status);
  box.innerHTML = `<span><b>${t.errTitle}</b> ${msg}</span>`;
  const act = lastError.code === "unauthorized" ? [t.setKey, openKey] : lastFile && lastError.code !== "bad_type" && lastError.code !== "no_api" ? [t.retry, () => analyse(lastFile)] : null;
  if (act) {
    const b = Object.assign(document.createElement("button"), { type: "button", className: "btn", textContent: act[0] });
    b.addEventListener("click", act[1]);
    box.appendChild(b);
  }
  box.hidden = false;
}

let ticker = null;
function busy(on) {
  const t = T[lang];
  $("drop").classList.toggle("busy", on);
  $("veil").hidden = !on;
  clearInterval(ticker);
  if (!on) return;
  const started = Date.now();
  const tick = () => {
    const s = Math.round((Date.now() - started) / 1000), tt = T[lang];
    $("vtitle").textContent = s < 2 ? tt.sending : s < 8 ? tt.analysing : tt.waking;
    $("vtext").textContent = tt.loadText;
    $("vel").textContent = tt.elapsed(s);
  };
  tick();
  ticker = setInterval(tick, 500);
}

function openKey() {
  $("keyin").value = store.get();
  $("keydlg").showModal();
  $("keyin").focus();
}

$("keydlg").addEventListener("close", () => {
  const v = $("keydlg").returnValue;
  if (v === "save") store.set($("keyin").value.trim());
  if (v === "clear") store.set("");
  if (v === "save" && store.get() && lastError?.code === "unauthorized" && lastFile) { chrome(); analyse(lastFile); return; }
  chrome();
});

async function analyse(file) {
  lastFile = file;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return showError("bad_type");
  if (file.size > MAX_BYTES) return showError("too_large");
  if (!API) return showError("no_api");
  const token = store.get();
  if (!token) { showError("unauthorized"); return openKey(); }
  showError(null);
  busy(true);
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(`${API}/api/analyze`, {
      method: "POST", body: file, signal: ctrl.signal,
      headers: { "content-type": file.type, "x-smearlens-token": token }
    });
    const body = await res.json().catch(() => null);
    if (!res.ok || !body || !Array.isArray(body.white_cells)) return showError({ code: body?.error || "other", status: res.status });
    const url = URL.createObjectURL(file);
    await new Promise((ok) => { $("img").onload = ok; $("img").onerror = ok; $("img").src = url; });
    if (imgUrl) URL.revokeObjectURL(imgUrl);
    imgUrl = url;
    data = { ...body, name: file.name };
    live = true;
    render();
    requestReview(file, body);
  } catch (err) {
    showError(err.name === "AbortError" ? "timeout" : "network");
  } finally {
    clearTimeout(timer);
    busy(false);
  }
}

function showSample() {
  if (!sample) return;
  live = false;
  reviewSeq++;
  showError(null);
  data = sample;
  $("img").src = "sample.jpg";
  render();
}

$("pick").addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) analyse(f); });
const viewer = document.querySelector(".viewer");
["dragenter", "dragover"].forEach((ev) => viewer.addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => viewer.addEventListener(ev, (e) => { e.preventDefault(); if (ev === "drop" || !viewer.contains(e.relatedTarget)) $("drop").classList.remove("over"); }));
viewer.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f && !$("drop").classList.contains("busy")) analyse(f); });
$("keybtn").addEventListener("click", openKey);
$("lang").addEventListener("click", () => { lang = lang === "en" ? "fr" : "en"; render(); });

chrome();
fetch("sample.json").then((r) => r.json()).then((j) => {
  const { round_trip_s, path, ...rest } = Array.isArray(j) ? j[0] : j;
  sample = { ...rest, name: "sample.jpg" };
  if (!data) showSample();
  return fetch("sample-review.json").then((r) => r.ok ? r.json() : null).then((r) => { sampleReview = r; if (!live) renderAgent(); }).catch(() => {});
}).catch(() => { document.body.insertAdjacentHTML("afterbegin", "<p style='padding:20px'>Cannot load sample.json. Serve this folder with: python3 -m http.server</p>"); });
</script>
</body>
</html>
